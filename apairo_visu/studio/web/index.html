<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>apairo studio</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
          <rect class="b1" x="2"  y="2"  width="7" height="5" rx="1.5"/>
          <rect class="b2" x="11" y="2"  width="7" height="5" rx="1.5"/>
          <rect class="b3" x="6.5" y="12" width="7" height="5" rx="2.5"/>
          <path class="e" d="M5.5 7v2c0 1.5 4.5 1 4.5 3M14.5 7v2c0 1.5-4.5 1-4.5 3" fill="none"/>
        </svg>
        apairo studio
      </div>
      <span id="status" class="status"></span>
      <span class="frame-box">
        <select id="track-select" class="ghost-select"
                title="Step the slider through one channel's frames only"></select>
        <input id="frame-slider" type="range" min="0" max="0" value="0">
        <input id="frame-goto" class="goto-input" placeholder="go to"
               title="Jump to a file stem (000850) on the selected channel, or to a frame index">
        <span id="frame-counter" class="frame-counter">0 / 0</span>
        <button id="range-clear" class="ghost" hidden>all frames</button>
      </span>
      <span class="spacer"></span>
      <select id="add-panel" class="ghost-select" title="Re-open a closed panel"></select>
      <button id="theme" class="ghost" title="theme: auto / light / dark">auto</button>
    </header>
    <main id="main">
      <div id="stack"></div>
      <!-- The server injects the pipeline SVG in place of GRAPH before
           serving (SSR-lite): the graph shows on first paint, then app.js
           adopts the <svg> into the pipeline panel and removes this host. -->
      <div id="graph-ssr"><!--GRAPH--></div>
    </main>
  </div>
  <!-- Three.js vendored locally (web/vendor): the studio must work offline. -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
