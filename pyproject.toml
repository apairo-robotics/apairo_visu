[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apairo-visu"
version = "0.1.1"
description = "Interactive 3D LiDAR visualisation for apairo datasets"
readme = "README.md"
authors = [
  { name = "Augustin Bresset", email = "augustin.bresset@gmail.com" },
]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["apairo", "lidar", "point-cloud", "visualization", "rerun"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy",
    "PyYAML",
    "apairo>=0.9",
]

[project.urls]
Homepage = "https://apairo-robotics.github.io/"
Repository = "https://github.com/apairo-robotics/apairo_visu"
Issues = "https://github.com/apairo-robotics/apairo_visu/issues"

# Ecosystem subcommands discovered by the core `apairo` CLI
# (see apairo.cli_plugins): `apairo studio <dir>`, `apairo visu ...`.
[project.entry-points."apairo.cli_plugins"]
studio = "apairo_visu.studio.cli:main"
visu = "apairo_visu.__main__:main"
rerun = "apairo_visu.rerun.cli:main"

[project.optional-dependencies]
# The desktop viewer (`apairo visu`, LidarViewer) is the only part that renders
# with Open3D, a large download: the studio and the Rerun backend never need it.
# matplotlib supplies its height (viridis) and label (tab20) colour maps.
open3d = ["open3d", "matplotlib"]
studio = ["fastapi", "uvicorn[standard]"]
rerun = ["rerun-sdk"]
dev = ["pytest", "httpx", "matplotlib"]

[tool.setuptools.packages.find]
where = ["."]
include = ["apairo_visu*"]

[tool.setuptools.package-data]
apairo_visu = [
    "configs/*.yaml",
    "studio/web/*.html",
    "studio/web/*.css",
    "studio/web/src/*.js",
    "studio/web/src/engine/*.js",
    "studio/web/vendor/three/*.js",
    "studio/web/vendor/three/addons/controls/*.js",
]

[tool.pytest.ini_options]
testpaths = ["test"]

